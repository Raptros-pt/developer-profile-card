<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="form-container">
        <div class="form-header">
            <h2>Get in Touch</h2>
            <p>Have a question or project in mind? Send a message below.</p>
        </div>

    <form action="#" method="POST" class="contact-form">
        <!-- Full Name Field -->
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Manuel Vicente" required>
        </div>

        <!-- Email Address Field -->
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="manelvicentester@gmail.com" required>
        </div>

        <!-- Service / Quest Type Dropdown-->
        <div class="form-group">
            <label for="service">Project type</label>
            <select id="service" name="service">
                <option value="bug-fix">CSS Bug Fix / Layout Issue</option>
                <option value="component">Custom HTML/CSS Component</option>
                <option value="landing-page">Landing Page Build</option>
                <option value="other">Other / General Inquiry</option>
            </select>
        </div>
        
        <!-- Message Textarea -->
         <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Describe what you'd like to build..." required></textarea>
        </div>

        <!-- Submit Button -->
         <button type="submit" class="submit-btn">Send Message</button>
    </form>
</main>

</body>
</html>
